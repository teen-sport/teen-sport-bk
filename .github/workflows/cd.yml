name: CD

# Workflow reutilizable invocado por el CI tras un push a main que superó build,
# tests, cobertura y SonarQube. Se usa workflow_call en lugar de workflow_run
# para no ejecutar código de forks con acceso a los secretos de despliegue.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  deploy:
    name: 6. Desplegar en Railway
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    container: ghcr.io/railwayapp/cli:5.63.4
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
    steps:
      - name: Descargar el commit que pasó el CI
        uses: actions/checkout@v4

      - name: Desplegar
        run: railway up --service="$RAILWAY_SERVICE_ID" --ci

  smoke-test:
    name: 7. Smoke test
    needs: deploy
    runs-on: ubuntu-latest
    env:
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - name: Verificar que la app responde
        run: |
          for i in $(seq 1 12); do
            if curl -fsS "$APP_URL/actuator/health"; then
              echo "La app está arriba"
              exit 0
            fi
            echo "Intento $i: aún no responde, esperando 15 s..."
            sleep 15
          done
          echo "La app no respondió"
          exit 1
