name: coverage

on:
  pull_request:
    branches: [development, laboratory, main]

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Pruebas y validación de cobertura (mínimo 80%)
        run: ./gradlew check

      - name: Resumen de cobertura
        if: always() && hashFiles('build/reports/jacoco/test/jacocoTestReport.csv') != ''
        run: |
          awk -F, 'NR>1 {bm+=$6; bc+=$7; lm+=$8; lc+=$9}
            END {
              printf "## Cobertura JaCoCo\n\n| Métrica | Cobertura |\n|---|---|\n"
              printf "| Líneas | %.1f%% |\n", (lc+lm) ? lc*100/(lc+lm) : 100
              printf "| Ramas  | %.1f%% |\n", (bc+bm) ? bc*100/(bc+bm) : 100
            }' build/reports/jacoco/test/jacocoTestReport.csv >> "$GITHUB_STEP_SUMMARY"

      - name: Subir reporte HTML
        if: always() && hashFiles('build/reports/jacoco/test/html/index.html') != ''
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: build/reports/jacoco/test/html/