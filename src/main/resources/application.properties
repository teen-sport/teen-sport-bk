spring.application.name=teen-sport-bk

# Variables locales desde un archivo .env en el directorio de trabajo, si existe (ver .env.example).
# Se lee como archivo de propiedades: CLAVE=valor, sin "export" ni comillas. Las variables de
# entorno del sistema tienen prioridad sobre las del archivo.
spring.config.import=optional:file:.env[.properties]

server.port=${PORT:8080}
server.error.include-stacktrace=never
server.error.include-message=never

# Mensajes de validación en español (la API presenta sus mensajes en español).
spring.web.locale=es
spring.web.locale-resolver=fixed

# PostgreSQL 18.6. La contraseña no tiene valor por defecto: debe llegar por variable de entorno.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/teen_sport}
spring.datasource.username=${DB_USERNAME:teen_sport}
spring.datasource.password=${DB_PASSWORD}

# Sin migraciones versionadas: Hibernate deriva el esquema de las entidades JPA (que mapean el MER).
# "update" crea y amplía tablas, pero no elimina columnas ni datos.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# El MER define las fechas como TIMESTAMP: los Instant se guardan sin zona, siempre en UTC.
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# JWT HS256. El secreto (mínimo 32 bytes) no tiene valor por defecto: debe llegar por variable de entorno.
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}

# Orígenes del frontend autorizados por CORS, separados por comas. Sin comodines.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Administrador inicial: se crea al arrancar solo si no existe ningún ADMIN y se definen
# ADMIN_EMAIL, ADMIN_PASSWORD y ADMIN_ID_NUMBER. Vacío = no se crea.
app.bootstrap.admin.email=${ADMIN_EMAIL:}
app.bootstrap.admin.password=${ADMIN_PASSWORD:}
app.bootstrap.admin.id-number=${ADMIN_ID_NUMBER:}
app.bootstrap.admin.id-type=${ADMIN_ID_TYPE:CC}
app.bootstrap.admin.first-names=${ADMIN_FIRST_NAMES:Administrador}
app.bootstrap.admin.last-names=${ADMIN_LAST_NAMES:TeenSport}

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
