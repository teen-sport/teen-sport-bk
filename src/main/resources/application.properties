spring.application.name=teen-sport-bk

# Variables locales desde un archivo .env en el directorio de trabajo, si existe (ver .env.example).
# Se lee como archivo de propiedades: CLAVE=valor, sin "export" ni comillas. Las variables de
# entorno del sistema tienen prioridad sobre las del archivo.
spring.config.import=optional:file:.env[.properties]

server.port=${PORT:8080}
server.error.include-stacktrace=never
server.error.include-message=never

# Zona horaria de la academia para las fechas de negocio (edad, periodos, sesiones).
app.time-zone=${APP_TIME_ZONE:America/Bogota}

# Mensajes de validación en español (la API presenta sus mensajes en español).
spring.web.locale=es
spring.web.locale-resolver=fixed

# PostgreSQL 18.6. La contraseña no tiene valor por defecto: debe llegar por variable de entorno.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/teen_sport}
spring.datasource.username=${DB_USERNAME:teen_sport}
spring.datasource.password=${DB_PASSWORD}

# Sin migraciones versionadas. DB_DDL_AUTO decide qué hace Hibernate con el esquema al arrancar:
#   validate (por defecto): no modifica la estructura; si faltan tablas o columnas, no arranca.
#   update: crea y amplía tablas y columnas a partir de las entidades (solo para una base local).
# Con validate, la aplicación solo consulta, inserta, actualiza y elimina datos.
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:validate}
spring.jpa.open-in-view=false
# El MER define las fechas como TIMESTAMP: los Instant se guardan sin zona, siempre en UTC.
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# JWT HS256. El secreto (mínimo 32 bytes) no tiene valor por defecto: debe llegar por variable de entorno.
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}

# Orígenes del frontend autorizados por CORS, separados por comas. Sin comodines.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Administrador inicial: se crea al arrancar solo si no existe ningún ADMIN y se definen
# ADMIN_EMAIL, ADMIN_PASSWORD y ADMIN_ID_NUMBER. Vacío = no se crea.
app.bootstrap.admin.email=${ADMIN_EMAIL:}
app.bootstrap.admin.password=${ADMIN_PASSWORD:}
app.bootstrap.admin.id-number=${ADMIN_ID_NUMBER:}
app.bootstrap.admin.id-type=${ADMIN_ID_TYPE:CC}
app.bootstrap.admin.first-names=${ADMIN_FIRST_NAMES:Administrador}
app.bootstrap.admin.last-names=${ADMIN_LAST_NAMES:TeenSport}

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# Correo transaccional con Brevo (ADR-09). La clave no tiene valor por defecto y nunca se versiona.
# Sin BREVO_API_KEY o MAIL_SENDER_EMAIL la aplicación arranca, pero las notificaciones quedan FAILED.
app.mail.brevo.api-key=${BREVO_API_KEY:}
app.mail.brevo.sender-email=${MAIL_SENDER_EMAIL:}
app.mail.brevo.sender-name=${MAIL_SENDER_NAME:TeenSport}
app.mail.brevo.base-url=https://api.brevo.com/v3
app.mail.brevo.connect-timeout=5s
app.mail.brevo.read-timeout=10s

# Reintentos de envío: hasta max-attempts intentos; tras el intento n se espera n x retry-delay.
app.notifications.max-attempts=3
app.notifications.retry-delay=2s
