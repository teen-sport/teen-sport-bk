        `paymentDate`, and the payment with the most recent `paymentDate` is the latest one. A second payment whose `paymentDate`
        falls in a month that already has a payment returns 409 `PAYMENT_ALREADY_REGISTERED`. `paymentDate` cannot be after today in
        the academy time zone (422 `FUTURE_DATE`); it may be before the enrollment start month. `registeredBy.id` is the admin user id.
      x-endpoint-id: E17
