      operationId: registerPayment
      summary: Register an in-person payment
      description: |
        **Roles:** ADMIN. Creates the payment, sets `paymentStatus` to `UP_TO_DATE` and clears `paymentReported`.
        `amountPaid` must be at least the discipline `monthlyFee`. Only while the enrollment is `PENDING_REVIEW` or `ACTIVE`.
