      tags: [Payments]
      operationId: updatePaymentStatus
      summary: Manually mark an enrollment as overdue
      description: |
        **Roles:** ADMIN. Only `OVERDUE` is accepted. `UP_TO_DATE` is reached only by registering a payment (E17 or E12).
        There is no automatic job (ADR-08). Accepted in any enrollment status; marking an enrollment that is already `OVERDUE`
