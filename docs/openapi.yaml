        '204': { description: Schedule deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  # -------------------------------------------------------------- SESSIONS
  /sessions:
    post:
      tags: [Sessions]
      operationId: createSession
      summary: Create a single training session
      description: |
        **Roles:** ADMIN, COACH (own group). The date cannot be in the past. It does not have to match a group schedule (extra sessions are allowed).
        A group cannot have two sessions with the same date and start time. Created in `SCHEDULED`. No e-mail is sent.
        "In the past" compares only the date in the academy time zone: today is accepted even if the hour has passed.
        The session is given by the current coach of the group. Validation order: 404, 403, `GROUP_INACTIVE`,
        `INVALID_TIME_RANGE`, `DATE_IN_PAST`, `DUPLICATE_SESSION`.
      x-endpoint-id: A1
      x-roles: [ADMIN, COACH]
      x-error-codes: [VALIDATION_ERROR, NOT_FOUND, GROUP_INACTIVE, DATE_IN_PAST, INVALID_TIME_RANGE, DUPLICATE_SESSION]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSessionRequest' }
      responses:
        '201':
          description: Session created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrainingSession' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    get:
      tags: [Sessions]
      operationId: listSessions
      summary: Session calendar
      description: |
        **Roles:** ADMIN (all), COACH (own groups, automatic), GUARDIAN (groups where one of their athletes has an `ACTIVE` enrollment
        whose start `period` is on or before the month of the session; each item includes `athletes`).
        Without dates the range is the current week (Monday to Sunday, academy time zone); with only `from` it is the seven days
        starting at `from`; with only `to`, the seven days ending at `to`. The range covers at most 62 days, both ends included
        (422 `INVALID_DATE_RANGE`). `athleteId` keeps the sessions of groups where that athlete has an `ACTIVE` enrollment already started.
      x-endpoint-id: A3
      x-roles: [ADMIN, COACH, GUARDIAN]
      x-error-codes: [INVALID_DATE_RANGE]
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
        - name: groupId
          in: query
          schema: { type: integer, format: int32 }
        - name: disciplineId
          in: query
          schema: { type: integer, format: int32 }
        - name: athleteId
          in: query
          schema: { type: integer, format: int32 }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/SessionStatus' }
      responses:
        '200':
          description: Sessions ordered by date and start time.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TrainingSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /sessions/generate:
    post:
      tags: [Sessions]
      operationId: generateSessions
      summary: Generate sessions from the group's weekly schedules
      description: |
        **Roles:** ADMIN, COACH (own group). Creates one session per schedule slot and date in the range (at most 62 days, both ends
        included). Sessions with the same date and start time as an existing one are skipped. `dateFrom` cannot be before today.
        With `notify=true` every guardian of an athlete with an `ACTIVE` enrollment in the group receives `SCHEDULE_PUBLISHED`
        (from phase 7; until then `notify` is accepted and no e-mail is sent). `sessions` holds only the created sessions.
      x-endpoint-id: A2
      x-roles: [ADMIN, COACH]
      x-error-codes: [VALIDATION_ERROR, NOT_FOUND, GROUP_INACTIVE, GROUP_WITHOUT_SCHEDULES, INVALID_DATE_RANGE, DATE_IN_PAST]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GenerateSessionsRequest' }
      responses:
        '201':
          description: Generation result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenerateSessionsResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /sessions/{id}:
    parameters:
      - { $ref: '#/components/parameters/IdPath' }
    get:
      tags: [Sessions]
      operationId: getSession
      summary: Get a session
      description: '**Roles:** same scope as A3. 403 if the session is outside the caller scope.'
      x-endpoint-id: A4
      x-roles: [ADMIN, COACH, GUARDIAN]
      x-error-codes: [NOT_FOUND]
      responses:
        '200':
          description: Session.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrainingSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Sessions]
      operationId: updateSession
      summary: Reschedule a session
      description: |
        **Roles:** ADMIN, COACH (own group). Only `SCHEDULED` sessions (409 `INVALID_STATE`). Same date, time and duplicate rules as A1,
        ignoring the session itself. `notes` replaces the previous notes. Sends `SCHEDULE_CHANGE` to the guardians of the group (phase 7).
      x-endpoint-id: A5
      x-roles: [ADMIN, COACH]
      x-error-codes: [VALIDATION_ERROR, NOT_FOUND, INVALID_STATE, DATE_IN_PAST, INVALID_TIME_RANGE, DUPLICATE_SESSION]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateSessionRequest' }
      responses:
        '200':
          description: Updated session.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrainingSession' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /sessions/{id}/cancel:
    parameters:
      - { $ref: '#/components/parameters/IdPath' }
    post:
      tags: [Sessions]
      operationId: cancelSession
      summary: Cancel a session
      description: |
        **Roles:** ADMIN, COACH (own group). Only `SCHEDULED` sessions. The reason is stored in `notes`. Cancelled sessions do not count
        in attendance reports. Sends `SCHEDULE_CHANGE` to the guardians of the group (phase 7).
      x-endpoint-id: A6
      x-roles: [ADMIN, COACH]
      x-error-codes: [VALIDATION_ERROR, NOT_FOUND, INVALID_STATE]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonRequiredRequest' }
      responses:
        '200':
          description: Cancelled session.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrainingSession' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  # ------------------------------------------------------------ ATTENDANCE
  /sessions/{id}/attendance:
    parameters:
      - { $ref: '#/components/parameters/IdPath' }
    get:
      tags: [Attendance]
      operationId: getSessionAttendance
      summary: Session roster with saved marks
      description: |
        **Roles:** COACH (assigned to the group), ADMIN. The roster is the `ACTIVE` enrollments of the group whose start `period`
        is on or before the month of the session, ordered by last name. `status` is null for athletes not yet marked. Marks of athletes
        that left the roster later are kept in the history (A9) but are not listed here.
      x-endpoint-id: A7
      x-roles: [COACH, ADMIN]
      x-error-codes: [NOT_FOUND]
      responses:
        '200':
          description: Roster.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttendanceRoster' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Attendance]
      operationId: recordSessionAttendance
      summary: Record attendance for the whole roster
      description: |
        **Roles:** COACH only (assigned to the group). One call with the whole roster; saving again overwrites the previous marks (upsert).
        Marks the session `COMPLETED`. Cannot be done for a future session (date after today in the academy time zone; today is
        allowed, 422 `FUTURE_SESSION`) or a cancelled one (409 `SESSION_CANCELLED`). An athlete outside the roster returns 422
        `ATHLETE_NOT_IN_ROSTER`; a missing one, 422 `INCOMPLETE_ATTENDANCE`; a repeated one, 400 `VALIDATION_ERROR` on `records`.
      x-endpoint-id: A8
      x-roles: [COACH]
      x-error-codes: [VALIDATION_ERROR, NOT_FOUND, INCOMPLETE_ATTENDANCE, ATHLETE_NOT_IN_ROSTER, FUTURE_SESSION, SESSION_CANCELLED]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecordAttendanceRequest' }
      responses:
        '200':
          description: Saved roster.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttendanceRoster' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /attendance-records:
    get:
      tags: [Attendance]
      operationId: listAttendanceRecords
      summary: Attendance history (paginated)
      description: |
        **Roles:** ADMIN (all), COACH (own groups, automatic), GUARDIAN (own athletes, automatic). Ordered by session date and start
        time descending. `from` and `to` filter the session date and are inclusive; `from` after `to` returns 422 `INVALID_DATE_RANGE`.
      x-endpoint-id: A9
      x-roles: [ADMIN, COACH, GUARDIAN]
      x-error-codes: [INVALID_DATE_RANGE]
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
        - name: athleteId
          in: query
          schema: { type: integer, format: int32 }
        - name: groupId
          in: query
          schema: { type: integer, format: int32 }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/AttendanceStatus' }
      responses:
        '200':
          description: A page of attendance records.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttendanceRecordPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  # --------------------------------------------------------------- REPORTS
  /reports/enrollments:
    get:
      tags: [Reports]
      operationId: getEnrollmentReport
      summary: Enrollment indicators
      description: |
        **Roles:** ADMIN. `period` is required. `completionRate` = `ACTIVE` / `totalRequests`; `abandonmentRate` = `CANCELLED` / `totalRequests` (percent).
        `averageConfirmationHours` is the mean of `confirmedAt - createdAt` over `ACTIVE` enrollments.
      x-endpoint-id: R1
      x-roles: [ADMIN]
      x-error-codes: [VALIDATION_ERROR]
      parameters:
        - { $ref: '#/components/parameters/PeriodRequired' }
      responses:
        '200':
          description: Report.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnrollmentReport' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /reports/attendance:
    get:
      tags: [Reports]
      operationId: getAttendanceReport
      summary: Attendance indicators
      description: |
        **Roles:** ADMIN, COACH (own groups). `scheduledSessions` are non-cancelled sessions with date up to today;
        `recordingCoverage` = `completedSessions` / `scheduledSessions`; `attendanceRate` = `PRESENT` / (`PRESENT` + `ABSENT`). Percent values.
      x-endpoint-id: R2
      x-roles: [ADMIN, COACH]
      x-error-codes: [VALIDATION_ERROR, INVALID_DATE_RANGE]
      parameters:
        - name: dateFrom
          in: query
          schema: { type: string, format: date }
        - name: dateTo
          in: query
          schema: { type: string, format: date }
        - name: groupId
          in: query
          schema: { type: integer, format: int32 }
        - name: disciplineId
          in: query
          schema: { type: integer, format: int32 }
      responses:
        '200':
          description: Report.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttendanceReport' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /reports/attendance/athletes/{id}:
    parameters:
      - { $ref: '#/components/parameters/IdPath' }
    get:
      tags: [Reports]
      operationId: getAthleteAttendanceReport
      summary: Attendance history and rate of one athlete
      description: '**Roles:** ADMIN, COACH (athlete in one of their groups), GUARDIAN (own athlete).'
      x-endpoint-id: R3
      x-roles: [ADMIN, COACH, GUARDIAN]
      x-error-codes: [NOT_FOUND, INVALID_DATE_RANGE]
      parameters:
        - name: dateFrom
          in: query
          schema: { type: string, format: date }
        - name: dateTo
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: Report.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AthleteAttendanceReport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /reports/attendance/recurrent-absences:
    get:
      tags: [Reports]
      operationId: getRecurrentAbsences
      summary: Athletes with consecutive absences
      description: |
        **Roles:** ADMIN, COACH (own groups). Returns athletes whose latest run of `ABSENT` marks is at least `minConsecutive` (default 3).
      x-endpoint-id: R4
      x-roles: [ADMIN, COACH]
      x-error-codes: [VALIDATION_ERROR]
      parameters:
        - name: minConsecutive
          in: query
          schema: { type: integer, minimum: 1, default: 3 }
        - name: groupId
          in: query
          schema: { type: integer, format: int32 }
        - name: dateFrom
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: Athletes with recurrent absences.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RecurrentAbsence' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'JWT with claims `sub`, `role`, `guardianId` or `coachId`, and `exp`.'
  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int32 }
    Page:
      name: page
      in: query
      description: Zero-based page index.
      schema: { type: integer, minimum: 0, default: 0 }
    Size:
      name: size
      in: query
      description: Page size (max 100).
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Period:
      name: period
      in: query
      description: Month in `YYYY-MM` format.
      schema: { $ref: '#/components/schemas/Period' }
    PeriodRequired:
      name: period
      in: query
      required: true
      description: Month in `YYYY-MM` format.
      schema: { $ref: '#/components/schemas/Period' }
  responses:
    BadRequest:
      description: Malformed request or failed field validation (`VALIDATION_ERROR`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            timestamp: '2026-10-08T15:30:00Z'
            status: 400
            code: VALIDATION_ERROR
            message: Hay campos con errores. Revisa los datos ingresados.
            details:
              - { field: email, message: El correo electrónico no es válido }
            path: /api/v1/users/register
    Unauthorized:
      description: Missing, invalid or expired token (`UNAUTHENTICATED`, `TOKEN_EXPIRED`) or wrong credentials (`INVALID_CREDENTIALS`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            timestamp: '2026-10-08T15:30:00Z'
            status: 401
            code: UNAUTHENTICATED
            message: Debes iniciar sesión para continuar.
            details: []
            path: /api/v1/users/me
    Forbidden:
      description: The role or the resource owner is not allowed (`ACCESS_DENIED`), or the user is inactive (`USER_INACTIVE`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            timestamp: '2026-10-08T15:30:00Z'
            status: 403
            code: ACCESS_DENIED
            message: No tienes permiso para realizar esta acción.
            details: []
            path: /api/v1/enrollments/12
    NotFound:
      description: The resource does not exist (`NOT_FOUND`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            timestamp: '2026-10-08T15:30:00Z'
            status: 404
            code: NOT_FOUND
            message: No se encontró el recurso solicitado.
            details: []
            path: /api/v1/enrollments/999
    Conflict:
      description: Duplicate resource, no spots, or the current state does not allow the action (409).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            timestamp: '2026-10-08T15:30:00Z'
            status: 409
            code: NO_AVAILABLE_SPOTS
            message: El grupo no tiene cupos disponibles para el periodo seleccionado.
            details: []
            path: /api/v1/enrollments
    Unprocessable:
      description: The request is well formed but breaks a business rule (422).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            timestamp: '2026-10-08T15:30:00Z'
            status: 422
            code: AGE_OUT_OF_RANGE
            message: El deportista debe tener entre 12 y 17 años.
            details: []
            path: /api/v1/athletes
    InternalError:
      description: Unexpected server failure (`INTERNAL_ERROR`). Applies to any operation; never exposes stack traces, SQL or internal details.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            timestamp: '2026-10-08T15:30:00Z'
            status: 500
            code: INTERNAL_ERROR
            message: Ocurrió un error inesperado. Intenta de nuevo más tarde.
            details: []
            path: /api/v1/enrollments
  schemas:
    # ------------------------------------------------------------ primitives
    Period:
      type: string
      pattern: '^\d{4}-(0[1-9]|1[0-2])$'
      example: '2026-10'
    Time:
      type: string
      pattern: '^([01]\d|2[0-3]):[0-5]\d$'
      example: '16:30'
    Role:
      type: string
      enum: [ADMIN, COACH, GUARDIAN]
    EnrollmentStatus:
      type: string
      enum: [PENDING_REVIEW, ACTIVE, REJECTED, CANCELLED]
    PaymentStatus:
      type: string
      enum: [UP_TO_DATE, OVERDUE]
    SessionStatus:
      type: string
      enum: [SCHEDULED, COMPLETED, CANCELLED]
    AttendanceStatus:
      type: string
      enum: [PRESENT, ABSENT]
    EntityStatus:
      type: string
      enum: [ACTIVE, INACTIVE]
    DayOfWeek:
      type: string
      enum: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY]
    ErrorCode:
      type: string
      enum:
        - VALIDATION_ERROR
        - UNAUTHENTICATED
        - TOKEN_EXPIRED
        - ACCESS_DENIED
        - NOT_FOUND
        - INVALID_STATE
        - AGE_OUT_OF_RANGE
        - DATA_POLICY_NOT_ACCEPTED
        - DUPLICATE_ATHLETE
        - PERIOD_IN_PAST
        - NO_AVAILABLE_SPOTS
        - DUPLICATE_ENROLLMENT
        - GROUP_INACTIVE
        - GROUP_OTHER_DISCIPLINE
        - PAYMENT_ALREADY_REGISTERED
        - INSUFFICIENT_AMOUNT
        - FUTURE_DATE
        - USE_PAYMENT_REGISTRATION
        - DUPLICATE_DISCIPLINE
        - DISCIPLINE_HAS_ACTIVE_GROUPS
        - DISCIPLINE_INACTIVE
        - INVALID_MAX_CAPACITY
        - CAPACITY_BELOW_OCCUPIED
        - INVALID_COACH
        - GROUP_HAS_ACTIVITY
        - INVALID_TIME_RANGE
        - SCHEDULE_CONFLICT
        - COACH_SCHEDULE_CONFLICT
        - DATE_IN_PAST
        - DUPLICATE_SESSION
        - INVALID_DATE_RANGE
        - GROUP_WITHOUT_SCHEDULES
        - INCOMPLETE_ATTENDANCE
        - ATHLETE_NOT_IN_ROSTER
        - FUTURE_SESSION
        - SESSION_CANCELLED
        - INVALID_CREDENTIALS
        - USER_INACTIVE
        - EMAIL_ALREADY_REGISTERED
        - ID_NUMBER_ALREADY_REGISTERED
        - WEAK_PASSWORD
        - INCORRECT_CURRENT_PASSWORD
        - CANNOT_DEACTIVATE_SELF
        - COACH_HAS_ACTIVE_GROUPS
        - INTERNAL_ERROR
    Error:
      type: object
      required: [timestamp, status, code, message, details, path]
      properties:
        timestamp: { type: string, format: date-time }
        status: { type: integer, example: 422 }
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          description: Text in Spanish, ready to show to the user. Never branch on it.
        details:
          type: array
          description: Field errors; empty unless `code` is `VALIDATION_ERROR`.
          items: { $ref: '#/components/schemas/ErrorDetail' }
        path: { type: string, example: /api/v1/enrollments }
    ErrorDetail:
      type: object
      required: [field, message]
      properties:
        field: { type: string, example: birthDate }
        message: { type: string, example: La fecha de nacimiento es obligatoria }
    PageMetadata:
      type: object
      required: [page, size, totalElements, totalPages]
      properties:
        page: { type: integer, example: 0 }
        size: { type: integer, example: 20 }
        totalElements: { type: integer, format: int64, example: 42 }
        totalPages: { type: integer, example: 3 }
    IdName:
      type: object
      required: [id, name]
      properties:
        id: { type: integer, format: int32 }
        name: { type: string }
    PersonRef:
      type: object
      required: [id, fullName]
      properties:
        id: { type: integer, format: int32 }
        fullName: { type: string }
    AthleteRef:
      type: object
      required: [id, firstNames, lastNames]
      properties:
        id: { type: integer, format: int32 }
        firstNames: { type: string }
        lastNames: { type: string }
    StatusRequest:
      type: object
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/EntityStatus' }
    ReasonRequiredRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 500, example: No se completó la documentación a tiempo. }
    ReasonOptionalRequest:
      type: object
      properties:
        reason: { type: string, maxLength: 500 }
    # ------------------------------------------------------------ auth/users
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password, maxLength: 72 }
    LoginResponse:
      type: object
      required: [accessToken, tokenType, expiresInSeconds, user]
      properties:
        accessToken: { type: string }
        tokenType: { type: string, example: Bearer }
        expiresInSeconds: { type: integer, example: 3600 }
        user:
          type: object
          required: [id, firstNames, lastNames, role]
          properties:
            id: { type: integer, format: int32 }
            firstNames: { type: string }
            lastNames: { type: string }
            role: { $ref: '#/components/schemas/Role' }
            guardianId: { type: integer, format: int32, nullable: true }
            coachId: { type: integer, format: int32, nullable: true }
    RegisterGuardianRequest:
      type: object
      required: [firstNames, lastNames, idType, idNumber, email, phone, password, acceptedDataPolicy]
      properties:
        firstNames: { type: string, maxLength: 100 }
        lastNames: { type: string, maxLength: 100 }
        idType: { type: string, example: CC, description: 'Document type, e.g. CC, CE.' }
        idNumber: { type: string, maxLength: 20 }
        email: { type: string, format: email }
        phone: { type: string, maxLength: 20 }
        homeAddress: { type: string, maxLength: 255 }
        password: { type: string, format: password, minLength: 8, maxLength: 72, description: '8 to 72 characters (72 bytes in UTF-8, the BCrypt limit) with at least one uppercase letter, one lowercase letter, one digit and one symbol. Length violations return 400 `VALIDATION_ERROR`; a missing character class returns 422 `WEAK_PASSWORD`.' }
        acceptedDataPolicy: { type: boolean, description: Must be true. }
    CreateUserRequest:
      type: object
      required: [role, firstNames, lastNames, idType, idNumber, email, phone, password]
      properties:
        role:
          type: string
          enum: [ADMIN, COACH]
        firstNames: { type: string }
        lastNames: { type: string }
        idType: { type: string }
        idNumber: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        password: { type: string, format: password, minLength: 8, maxLength: 72, description: '8 to 72 characters (72 bytes in UTF-8, the BCrypt limit) with at least one uppercase letter, one lowercase letter, one digit and one symbol. Length violations return 400 `VALIDATION_ERROR`; a missing character class returns 422 `WEAK_PASSWORD`.' }
        specialty: { type: string, description: Coach only. }
        yearsOfExperience: { type: integer, minimum: 0, description: Coach only. }
    UpdateUserRequest:
      type: object
      required: [firstNames, lastNames, phone]
      properties:
        firstNames: { type: string }
        lastNames: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        homeAddress: { type: string, description: Guardian only. }
        specialty: { type: string, description: Coach only. }
        yearsOfExperience: { type: integer, minimum: 0, description: Coach only. }
    UpdateOwnProfileRequest:
      type: object
      required: [firstNames, lastNames, phone]
      properties:
        firstNames: { type: string }
        lastNames: { type: string }
        phone: { type: string }
        homeAddress: { type: string, description: Guardian only. }
        specialty: { type: string, description: Coach only. }
        yearsOfExperience: { type: integer, minimum: 0, description: Coach only. }
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, format: password }
        newPassword: { type: string, format: password, minLength: 8, maxLength: 72, description: '8 to 72 characters (72 bytes in UTF-8, the BCrypt limit) with at least one uppercase letter, one lowercase letter, one digit and one symbol. Length violations return 400 `VALIDATION_ERROR`; a missing character class returns 422 `WEAK_PASSWORD`.' }
    UserProfile:
      type: object
      required: [id, firstNames, lastNames, idType, idNumber, email, phone, role, status]
      properties:
        id: { type: integer, format: int32 }
        idType: { type: string }
        idNumber: { type: string }
        firstNames: { type: string }
        lastNames: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        status: { $ref: '#/components/schemas/EntityStatus' }
        acceptedDataPolicy: { type: boolean }
        guardian:
          type: object
          nullable: true
          description: Only for role GUARDIAN.
          properties:
            id: { type: integer, format: int32 }
            homeAddress: { type: string, nullable: true }
        coach:
          type: object
          nullable: true
          description: Only for role COACH.
          properties:
            id: { type: integer, format: int32 }
            specialty: { type: string, nullable: true }
            yearsOfExperience: { type: integer, nullable: true }
    UserPage:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          required: [content]
          properties:
            content:
              type: array
              items: { $ref: '#/components/schemas/UserProfile' }
    CoachListItem:
      type: object
      required: [id, userId, fullName, status]
      properties:
        id: { type: integer, format: int32, description: Coach id. Used by H8 and H11. }
        userId: { type: integer, format: int32 }
        fullName: { type: string }
        specialty: { type: string, nullable: true }
        yearsOfExperience: { type: integer, nullable: true }
        status: { $ref: '#/components/schemas/EntityStatus' }
    GuardianListItem:
      type: object
      required: [id, userId, fullName, email, phone]
      properties:
        id: { type: integer, format: int32, description: Guardian id. Used by E1. }
        userId: { type: integer, format: int32 }
        fullName: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
    GuardianPage:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          required: [content]
          properties:
            content:
              type: array
              items: { $ref: '#/components/schemas/GuardianListItem' }
    # -------------------------------------------------------------- athletes
    CreateAthleteRequest:
      type: object
      required: [firstNames, lastNames, idType, idNumber, birthDate]
      properties:
        guardianId: { type: integer, format: int32, description: Admin only; ignored for guardians. }
        firstNames: { type: string }
        lastNames: { type: string }
        idType: { type: string, example: TI }
        idNumber: { type: string }
        birthDate: { type: string, format: date, example: '2010-05-14' }
        gender: { type: string, example: FEMALE, description: Optional. }
    UpdateAthleteRequest:
      type: object
      required: [firstNames, lastNames, idType, idNumber, birthDate]
      properties:
        firstNames: { type: string }
        lastNames: { type: string }
        idType: { type: string }
        idNumber: { type: string }
        birthDate: { type: string, format: date }
        gender: { type: string }
    Athlete:
      type: object
      required: [id, guardianId, firstNames, lastNames, idType, idNumber, birthDate, age, hasActiveEnrollment]
      properties:
        id: { type: integer, format: int32 }
        guardianId: { type: integer, format: int32 }
        firstNames: { type: string }
        lastNames: { type: string }
        idType: { type: string }
        idNumber: { type: string }
        birthDate: { type: string, format: date }
        age: { type: integer, description: Computed on the response date. }
        gender: { type: string, nullable: true }
        hasActiveEnrollment: { type: boolean, description: The athlete has an enrollment in `PENDING_REVIEW` or `ACTIVE`. }
    AthletePage:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          required: [content]
          properties:
            content:
              type: array
              items: { $ref: '#/components/schemas/Athlete' }
    # ----------------------------------------------------------- enrollments
    GroupAvailability:
      type: object
      required: [groupId, groupName, discipline, coach, schedules, maxCapacity, occupiedSpots, availableSpots]
      properties:
        groupId: { type: integer, format: int32 }
        groupName: { type: string }
        discipline:
          type: object
          required: [id, name, monthlyFee]
          properties:
            id: { type: integer, format: int32 }
            name: { type: string }
            monthlyFee: { type: number, multipleOf: 0.01, description: 'COP, DECIMAL(10,2).' }
        coach: { $ref: '#/components/schemas/PersonRef' }
        schedules:
          type: array
          items: { $ref: '#/components/schemas/Schedule' }
        maxCapacity: { type: integer }
        occupiedSpots: { type: integer, description: In-force enrollments that started on or before the period. }
        availableSpots: { type: integer, description: '`maxCapacity` minus all in-force enrollments, never negative.' }
    CreateEnrollmentRequest:
      type: object
      required: [athleteId, groupId, period]
      properties:
        athleteId: { type: integer, format: int32 }
        groupId: { type: integer, format: int32 }
        period: { $ref: '#/components/schemas/Period' }
    EnrollmentSummary:
      type: object
      required: [id, athlete, group, discipline, period, status, paymentStatus, paymentReported, createdAt]
      properties:
        id: { type: integer, format: int32 }
        athlete: { $ref: '#/components/schemas/AthleteRef' }
        group: { $ref: '#/components/schemas/IdName' }
        discipline: { $ref: '#/components/schemas/IdName' }
        period: { $ref: '#/components/schemas/Period' }
        status: { $ref: '#/components/schemas/EnrollmentStatus' }
        paymentStatus: { $ref: '#/components/schemas/PaymentStatus' }
        paymentReported: { type: boolean }
        createdAt: { type: string, format: date-time }
    EnrollmentDetail:
      allOf:
        - $ref: '#/components/schemas/EnrollmentSummary'
        - type: object
          required: [schedules]
          properties:
            schedules:
              type: array
              items: { $ref: '#/components/schemas/Schedule' }
            reviewNotes: { type: string, nullable: true, description: Last message or reason written by the admin. }
            confirmedAt: { type: string, format: date-time, nullable: true }
    EnrollmentPage:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          required: [content]
          properties:
            content:
              type: array
              items: { $ref: '#/components/schemas/EnrollmentSummary' }
    ConfirmEnrollmentRequest:
      type: object
      properties:
        groupId: { type: integer, format: int32, description: Optional. Another group of the same discipline. }
        payment: { $ref: '#/components/schemas/RegisterPaymentRequest' }
    ChangeGroupRequest:
      type: object
      required: [groupId]
      properties:
        groupId: { type: integer, format: int32 }
    PaymentReportRequest:
      type: object
      properties:
        paymentDate: { type: string, format: date }
        notes: { type: string, maxLength: 255 }
    RegisterPaymentRequest:
      type: object
      required: [amountPaid, paymentDate]
      properties:
        amountPaid: { type: number, multipleOf: 0.01, minimum: 0, exclusiveMinimum: true, maximum: 99999999.99, description: 'COP, DECIMAL(10,2).', example: 120000 }
        paymentDate: { type: string, format: date, description: Cannot be in the future. }
        receiptReference: { type: string, maxLength: 50, description: 'The MER column allows 100; the contract keeps 50.' }
        notes: { type: string, maxLength: 255 }
    PaymentStatusRequest:
      type: object
      required: [paymentStatus]
      properties:
        paymentStatus:
          type: string
          enum: [OVERDUE]
    Payment:
      type: object
      required: [id, enrollmentId, amountPaid, paymentDate]
      properties:
        id: { type: integer, format: int32 }
        enrollmentId: { type: integer, format: int32 }
        athlete: { $ref: '#/components/schemas/AthleteRef' }
        discipline: { $ref: '#/components/schemas/IdName' }
        period:
          allOf: [{ $ref: '#/components/schemas/Period' }]
          description: Month covered by the payment, i.e. the `YYYY-MM` of `paymentDate`.
        amountPaid: { type: number, multipleOf: 0.01, description: 'COP, DECIMAL(10,2).' }
        paymentDate: { type: string, format: date }
        receiptReference: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        registeredBy: { $ref: '#/components/schemas/PersonRef' }
        createdAt: { type: string, format: date-time }
    PaymentPage:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          required: [content]
          properties:
            content:
              type: array
              items: { $ref: '#/components/schemas/Payment' }
    # --------------------------------------------------------------- catalog
    DisciplineRequest:
      type: object
      required: [name, monthlyFee]
      properties:
        name: { type: string, maxLength: 100, example: Fútbol }
        description: { type: string, maxLength: 500 }
        monthlyFee: { type: number, multipleOf: 0.01, minimum: 0, exclusiveMinimum: true, maximum: 99999999.99, description: 'COP, DECIMAL(10,2).', example: 120000 }
    Discipline:
      type: object
      required: [id, name, monthlyFee, status]
      properties:
        id: { type: integer, format: int32 }
        name: { type: string }
        description: { type: string, nullable: true }
        monthlyFee: { type: number, multipleOf: 0.01, description: 'COP, DECIMAL(10,2).' }
        status: { $ref: '#/components/schemas/EntityStatus' }
    Schedule:
      type: object
      required: [id, dayOfWeek, startTime, endTime]
      properties:
        id: { type: integer, format: int32 }
        dayOfWeek: { $ref: '#/components/schemas/DayOfWeek' }
        startTime: { $ref: '#/components/schemas/Time' }
        endTime: { $ref: '#/components/schemas/Time' }
    ScheduleRequest:
      type: object
      required: [dayOfWeek, startTime, endTime]
      properties:
        dayOfWeek: { $ref: '#/components/schemas/DayOfWeek' }
        startTime: { $ref: '#/components/schemas/Time' }
        endTime: { $ref: '#/components/schemas/Time' }
    Group:
      type: object
      required: [id, name, discipline, coach, maxCapacity, status, schedules]
      properties:
        id: { type: integer, format: int32 }
        name: { type: string }
        discipline: { $ref: '#/components/schemas/IdName' }
        coach: { $ref: '#/components/schemas/PersonRef' }
        maxCapacity: { type: integer, minimum: 1, maximum: 15 }
        status: { $ref: '#/components/schemas/EntityStatus' }
        schedules:
          type: array
          items: { $ref: '#/components/schemas/Schedule' }
    CreateGroupRequest:
      type: object
      required: [disciplineId, coachId, name, maxCapacity]
      properties:
        disciplineId: { type: integer, format: int32 }
        coachId: { type: integer, format: int32 }
        name: { type: string, maxLength: 100 }
        maxCapacity: { type: integer, minimum: 1, maximum: 15 }
    UpdateGroupRequest:
      type: object
      required: [name, maxCapacity]
      properties:
        name: { type: string, maxLength: 100 }
        maxCapacity: { type: integer, minimum: 1, maximum: 15 }
    AssignCoachRequest:
      type: object
      required: [coachId]
      properties:
        coachId: { type: integer, format: int32 }
    # -------------------------------------------------------------- sessions
    CreateSessionRequest:
      type: object
      required: [groupId, date, startTime, endTime]
      properties:
        groupId: { type: integer, format: int32 }
        date: { type: string, format: date }
        startTime: { $ref: '#/components/schemas/Time' }
        endTime: { $ref: '#/components/schemas/Time' }
        notes: { type: string, maxLength: 500 }
    UpdateSessionRequest:
      type: object
      required: [date, startTime, endTime]
      properties:
        date: { type: string, format: date }
        startTime: { $ref: '#/components/schemas/Time' }
        endTime: { $ref: '#/components/schemas/Time' }
        notes: { type: string, maxLength: 500 }
    GenerateSessionsRequest:
      type: object
      required: [groupId, dateFrom, dateTo]
      properties:
        groupId: { type: integer, format: int32 }
        dateFrom: { type: string, format: date }
        dateTo: { type: string, format: date }
        notify: { type: boolean, default: false }
    TrainingSession:
      type: object
      required: [id, group, discipline, coach, date, startTime, endTime, status, attendanceRecorded]
      properties:
        id: { type: integer, format: int32 }
        group: { $ref: '#/components/schemas/IdName' }
        discipline: { $ref: '#/components/schemas/IdName' }
        coach: { $ref: '#/components/schemas/PersonRef' }
        date: { type: string, format: date }
        startTime: { $ref: '#/components/schemas/Time' }
        endTime: { $ref: '#/components/schemas/Time' }
        status: { $ref: '#/components/schemas/SessionStatus' }
        attendanceRecorded: { type: boolean }
        notes: { type: string, nullable: true, description: Free notes; on a cancelled session it holds the cancellation reason. }
        athletes:
          type: array
          description: Only in guardian responses; the guardian's athletes that attend this session.
          items:
            type: object
            required: [id, firstNames]
            properties:
              id: { type: integer, format: int32 }
              firstNames: { type: string }
    GenerateSessionsResponse:
      type: object
      required: [created, skipped, sessions]
      properties:
        created: { type: integer }
        skipped: { type: integer }
        sessions:
          type: array
          items: { $ref: '#/components/schemas/TrainingSession' }
    # ------------------------------------------------------------ attendance
    AttendanceRosterEntry:
      type: object
      required: [athleteId, firstNames, lastNames, status]
      properties:
        athleteId: { type: integer, format: int32 }
        firstNames: { type: string }
        lastNames: { type: string }
        status:
          allOf:
            - $ref: '#/components/schemas/AttendanceStatus'
          nullable: true
    AttendanceRoster:
      type: object
      required: [sessionId, group, date, status, attendanceRecorded, records]
      properties:
        sessionId: { type: integer, format: int32 }
        group: { $ref: '#/components/schemas/IdName' }
        date: { type: string, format: date }
        status: { $ref: '#/components/schemas/SessionStatus' }
        attendanceRecorded: { type: boolean }
        records:
          type: array
          description: Roster ordered by last name; `status` is null until recorded.
          items: { $ref: '#/components/schemas/AttendanceRosterEntry' }
    RecordAttendanceRequest:
      type: object
      required: [records]
      properties:
        records:
          type: array
          minItems: 1
          items:
            type: object
            required: [athleteId, status]
            properties:
              athleteId: { type: integer, format: int32 }
              status: { $ref: '#/components/schemas/AttendanceStatus' }
    AttendanceRecord:
      type: object
      required: [id, sessionId, date, group, discipline, athlete, status, recordedAt]
      properties:
        id: { type: integer, format: int32 }
        sessionId: { type: integer, format: int32 }
        date: { type: string, format: date }
        group: { $ref: '#/components/schemas/IdName' }
        discipline: { $ref: '#/components/schemas/IdName' }
        athlete: { $ref: '#/components/schemas/AthleteRef' }
        status: { $ref: '#/components/schemas/AttendanceStatus' }
        recordedAt: { type: string, format: date-time }
    AttendanceRecordPage:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          required: [content]
          properties:
            content:
              type: array
              items: { $ref: '#/components/schemas/AttendanceRecord' }
    # --------------------------------------------------------------- reports
    EnrollmentReport:
      type: object
      required: [period, totalRequests, byStatus, completionRate, abandonmentRate, averageConfirmationHours, byDiscipline, payments]
      properties:
        period: { $ref: '#/components/schemas/Period' }
        totalRequests: { type: integer }
        byStatus:
          type: object
          description: Count per enrollment status.
          additionalProperties: { type: integer }
          example: { PENDING_REVIEW: 6, ACTIVE: 20, REJECTED: 1, CANCELLED: 3 }
        completionRate: { type: number, format: double, description: Percent., example: 66.7 }
        abandonmentRate: { type: number, format: double, description: Percent., example: 10.0 }
        averageConfirmationHours: { type: number, format: double, nullable: true, example: 18.5 }
        byDiscipline:
          type: array
          items:
            type: object
            required: [disciplineId, name, requests, active]
            properties:
              disciplineId: { type: integer, format: int32 }
              name: { type: string }
              requests: { type: integer }
              active: { type: integer }
        payments:
          type: object
          properties:
            upToDate: { type: integer }
            overdue: { type: integer }
    AttendanceReport:
      type: object
      required: [scheduledSessions, completedSessions, recordingCoverage, attendanceRate, byGroup]
      properties:
        scheduledSessions: { type: integer }
        completedSessions: { type: integer }
        recordingCoverage: { type: number, format: double, description: 'Percent. Target of RNF-10: 90 or more.', example: 92.5 }
        attendanceRate: { type: number, format: double, nullable: true, description: Percent., example: 84.2 }
        byGroup:
          type: array
          items:
            type: object
            required: [groupId, groupName, discipline, scheduledSessions, completedSessions, attendanceRate]
            properties:
              groupId: { type: integer, format: int32 }
              groupName: { type: string }
              discipline: { type: string }
              scheduledSessions: { type: integer }
              completedSessions: { type: integer }
              attendanceRate: { type: number, format: double, nullable: true }
    AthleteAttendanceReport:
      type: object
      required: [athleteId, recordedSessions, present, absent, attendanceRate, byGroup]
      properties:
        athleteId: { type: integer, format: int32 }
        recordedSessions: { type: integer }
        present: { type: integer }
        absent: { type: integer }
        attendanceRate: { type: number, format: double, nullable: true, description: Percent. }
        byGroup:
          type: array
          items:
            type: object
            required: [groupId, groupName, present, absent, attendanceRate]
            properties:
              groupId: { type: integer, format: int32 }
              groupName: { type: string }
              present: { type: integer }
              absent: { type: integer }
              attendanceRate: { type: number, format: double, nullable: true }
    RecurrentAbsence:
      type: object
      required: [athlete, group, consecutiveAbsences]
      properties:
        athlete: { $ref: '#/components/schemas/AthleteRef' }
        group: { $ref: '#/components/schemas/IdName' }
        consecutiveAbsences: { type: integer, example: 3 }
        lastAttendance: { type: string, format: date, nullable: true }
