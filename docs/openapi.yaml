openapi: 3.0.3
info:
  title: TeenSport API
  version: 1.0.0
  description: |
    REST API for TeenSport, the web system of a youth multi-sport academy.
    Covers authentication and users, Process 1 (enrollment) and Process 2 (training and attendance).

    **Language convention.** Everything that is code is in English: paths, query parameters, JSON fields,
    enum values and error codes. Everything the end user sees is in Spanish: the `message` field of every
    error, e-mail content and UI texts. Clients must branch on `code`, never on `message`.

    **Authentication.** Send `Authorization: Bearer <JWT>` on every request except `POST /auth/login`
    and `POST /users/register`. Roles are `ADMIN`, `COACH` and `GUARDIAN`.

    **Ownership.** "Own" means the resource belongs to the caller: an athlete of the guardian, a group of the
    coach. Accessing someone else's resource returns `403 ACCESS_DENIED`. On list endpoints the backend filters
    by ownership automatically.

    **Formats.** Dates `2026-10-06`, times `16:30`, period `2026-10` (`YYYY-MM`), timestamps ISO-8601 UTC,
    money as a decimal number in COP.

    **Status codes.** 200 read or update, 201 creation (with a `Location` header), 204 no body, 400 malformed or invalid fields,
    401 not authenticated, 403 not allowed, 404 not found, 409 duplicate or state conflict, 422 business rule broken.

    Each operation carries two vendor extensions: `x-endpoint-id` (the id used in the project documents) and
    `x-roles` (roles allowed to call it).
servers:
  - url: http://localhost:8080/api/v1
    description: Local development
security:
  - bearerAuth: []
tags:
  - name: Auth
    description: Login (1 endpoint)
  - name: Users
    description: Registration, own profile and user administration (11 endpoints)
  - name: Athletes
    description: Athlete profiles managed by guardians (4 endpoints)
  - name: Enrollments
    description: Availability and enrollment lifecycle (8 endpoints)
  - name: Payments
    description: Payment report, registration, status and history (4 endpoints, under /enrollments and /payments)
  - name: Disciplines
    description: Discipline catalog (5 endpoints)
  - name: Groups
    description: Training groups, coaches and weekly schedules (9 endpoints)
  - name: Sessions
    description: Training session calendar (6 endpoints)
  - name: Attendance
    description: Attendance registration and queries (3 endpoints)
  - name: Reports
    description: Read-only indicators (4 endpoints)
paths:
  # ------------------------------------------------------------------ AUTH
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Log in and get a JWT
      description: |
        **Roles:** public. Same error for a wrong e-mail or a wrong password.
      x-endpoint-id: U1
      x-roles: [PUBLIC]
      x-error-codes: [VALIDATION_ERROR, INVALID_CREDENTIALS, USER_INACTIVE]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Authenticated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  # ----------------------------------------------------------------- USERS
  /users/register:
    post:
      tags: [Users]
      operationId: registerGuardian
      summary: Register a guardian account
      description: |
        **Roles:** public. Only guardians register themselves; coaches and admins are created by an admin (U8).
        Creates the `users` and `guardians` rows in one transaction, with role `GUARDIAN`. `acceptedDataPolicy` must be `true` (Law 1581 of 2012).
        After this, the client calls `POST /auth/login`.
      x-endpoint-id: U2
      x-roles: [PUBLIC]
      x-error-codes: [VALIDATION_ERROR, DATA_POLICY_NOT_ACCEPTED, EMAIL_ALREADY_REGISTERED, ID_NUMBER_ALREADY_REGISTERED, WEAK_PASSWORD]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterGuardianRequest' }
      responses:
        '201':
          description: Guardian created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /users/me:
    get:
      tags: [Users]
      operationId: getMyProfile
      summary: Get the authenticated user's profile
      description: '**Roles:** any authenticated user.'
      x-endpoint-id: U3
      x-roles: [ADMIN, COACH, GUARDIAN]
      x-error-codes: []
      responses:
        '200':
          description: Profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [Users]
      operationId: updateMyProfile
      summary: Update the authenticated user's profile
      description: |
        **Roles:** any authenticated user. E-mail, ID and role cannot be changed here.
        Send `homeAddress` as a guardian, or `specialty` and `yearsOfExperience` as a coach.
        Fields of another role, and any e-mail, ID or role sent in the body, are ignored. It is a full replacement:
        an optional field of the caller's role that is not sent is cleared.
      x-endpoint-id: U4
      x-roles: [ADMIN, COACH, GUARDIAN]
      x-error-codes: [VALIDATION_ERROR]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateOwnProfileRequest' }
      responses:
        '200':
          description: Updated profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /users/me/password:
    put:
      tags: [Users]
      operationId: changeMyPassword
      summary: Change the authenticated user's password
      description: '**Roles:** any authenticated user. Passwords are stored hashed with BCrypt.'
      x-endpoint-id: U5
      x-roles: [ADMIN, COACH, GUARDIAN]
      x-error-codes: [VALIDATION_ERROR, INCORRECT_CURRENT_PASSWORD, WEAK_PASSWORD]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '204': { description: Password changed. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: List users (paginated)
      description: |
        **Roles:** ADMIN. Ordered by last names, first names and id. `q` matches, case-insensitively, first names,
        last names, full name, e-mail or ID number; `%` and `_` are searched as literal text.
      x-endpoint-id: U6
      x-roles: [ADMIN]
      x-error-codes: []
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
        - name: role
          in: query
          schema: { $ref: '#/components/schemas/Role' }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/EntityStatus' }
        - name: q
          in: query
          description: Free text over name, e-mail and ID number.
          schema: { type: string }
      responses:
        '200':
          description: A page of users.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Users]
      operationId: createStaffUser
      summary: Create a coach or an admin account
      description: |
        **Roles:** ADMIN. For a coach it also creates the `coaches` row.
        `acceptedDataPolicy` is only enforced for guardians. `role` must be `ADMIN` or `COACH`; any other value
        returns 400 `VALIDATION_ERROR` on the field `staffRole`. `specialty` and `yearsOfExperience` are ignored for admins.
      x-endpoint-id: U8
      x-roles: [ADMIN]
      x-error-codes: [VALIDATION_ERROR, EMAIL_ALREADY_REGISTERED, ID_NUMBER_ALREADY_REGISTERED, WEAK_PASSWORD]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUserRequest' }
      responses:
        '201':
          description: User created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /users/{id}:
    parameters:
      - { $ref: '#/components/parameters/IdPath' }
    get:
      tags: [Users]
      operationId: getUser
      summary: Get a user
      description: '**Roles:** ADMIN.'
      x-endpoint-id: U7
      x-roles: [ADMIN]
      x-error-codes: [NOT_FOUND]
      responses:
        '200':
          description: User.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Users]
      operationId: updateUser
      summary: Update a user
      description: |
        **Roles:** ADMIN. The role, ID and status never change here. `email` is optional: when omitted it is kept.
        The other fields follow the rules of U4 (fields of another role are ignored; an omitted optional field of the
        user's role is cleared).
      x-endpoint-id: U9
      x-roles: [ADMIN]
      x-error-codes: [VALIDATION_ERROR, NOT_FOUND, EMAIL_ALREADY_REGISTERED]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateUserRequest' }
      responses:
        '200':
          description: Updated user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /users/{id}/status:
    parameters:
      - { $ref: '#/components/parameters/IdPath' }
    patch:
      tags: [Users]
      operationId: updateUserStatus
      summary: Activate or deactivate a user
      description: |
        **Roles:** ADMIN. An inactive user cannot log in; a token already issued expires on its own.
        An admin cannot deactivate their own account (422 `CANNOT_DEACTIVATE_SELF`). A coach with `ACTIVE` groups cannot be
        deactivated (409 `COACH_HAS_ACTIVE_GROUPS`).
      x-endpoint-id: U10
      x-roles: [ADMIN]
      x-error-codes: [NOT_FOUND, CANNOT_DEACTIVATE_SELF, COACH_HAS_ACTIVE_GROUPS]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StatusRequest' }
      responses:
        '200':
          description: Updated user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /coaches:
    get:
      tags: [Users]
      operationId: listCoaches
      summary: List coaches
      description: '**Roles:** ADMIN. Used to pick a coach when creating or editing a group (H8, H11). `id` is the coach id, `userId` the user id.'
      x-endpoint-id: U11
      x-roles: [ADMIN]
      x-error-codes: []
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/EntityStatus' }
      responses:
        '200':
          description: Coaches.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CoachListItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /guardians:
    get:
      tags: [Users]
      operationId: listGuardians
      summary: List guardians (paginated)
      description: |
        **Roles:** ADMIN. Used when an admin registers an athlete on behalf of a guardian (E1).
        Ordered by last names and first names. `q` works as in U6.
      x-endpoint-id: U12
      x-roles: [ADMIN]
      x-error-codes: []
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
        - name: q
          in: query
          schema: { type: string }
      responses:
        '200':
          description: A page of guardians.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GuardianPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  # -------------------------------------------------------------- ATHLETES
  /athletes:
    post:
      tags: [Athletes]
      operationId: createAthlete
      summary: Register an athlete
      description: |
        **Roles:** GUARDIAN (own), ADMIN. `guardianId` is only sent by an admin; for a guardian it comes from the token.
        Age must be 12 to 17 on the request date, and the guardian must have accepted the data policy.
        The request date is the academy's local date (`America/Bogota` by default). For an admin `guardianId` is
        required and must be an active guardian; otherwise 400 `VALIDATION_ERROR` on `guardianId`.
        `idNumber` is unique among athletes (409 `DUPLICATE_ATHLETE`).
      x-endpoint-id: E1
      x-roles: [GUARDIAN, ADMIN]
      x-error-codes: [VALIDATION_ERROR, AGE_OUT_OF_RANGE, DATA_POLICY_NOT_ACCEPTED, DUPLICATE_ATHLETE]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAthleteRequest' }
      responses:
        '201':
          description: Athlete created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Athlete' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    get:
      tags: [Athletes]
      operationId: listAthletes
      summary: List athletes (paginated)
      description: |
        **Roles:** ADMIN (all), GUARDIAN (only own, automatic; `guardianId` is ignored).
        Ordered by last names and first names. `q` matches first names, last names, full name or ID number.
      x-endpoint-id: E2
      x-roles: [ADMIN, GUARDIAN]
      x-error-codes: []
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
        - name: q
          in: query
          description: Free text over name and ID number.
          schema: { type: string }
        - name: guardianId
          in: query
          description: Admin only.
          schema: { type: integer, format: int32 }
      responses:
        '200':
          description: A page of athletes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AthletePage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /athletes/{id}:
    parameters:
      - { $ref: '#/components/parameters/IdPath' }
    get:
      tags: [Athletes]
      operationId: getAthlete
      summary: Get an athlete
      description: '**Roles:** ADMIN, GUARDIAN (own).'
      x-endpoint-id: E3
      x-roles: [ADMIN, GUARDIAN]
      x-error-codes: [NOT_FOUND]
      responses:
        '200':
          description: Athlete.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Athlete' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Athletes]
      operationId: updateAthlete
      summary: Update an athlete
      description: |
        **Roles:** ADMIN, GUARDIAN (own). There is no DELETE: leaving the academy means cancelling the enrollment.
        The guardian never changes. The age range is checked only when `birthDate` changes, so an athlete who has
        turned 18 can still be corrected.
      x-endpoint-id: E4
      x-roles: [ADMIN, GUARDIAN]
      x-error-codes: [VALIDATION_ERROR, NOT_FOUND, AGE_OUT_OF_RANGE, DUPLICATE_ATHLETE]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateAthleteRequest' }
      responses:
        '200':
          description: Updated athlete.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Athlete' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  # ----------------------------------------------------------- ENROLLMENTS
  /availability:
    get:
      tags: [Enrollments]
      operationId: getAvailability
      summary: Groups with free spots for a period
      description: |
        **Roles:** ADMIN, GUARDIAN. Returns only `ACTIVE` groups of `ACTIVE` disciplines, with `occupiedSpots` and `availableSpots` for the period.
        Occupied spots count enrollments in `PENDING_REVIEW` and `ACTIVE` whose start `period` is on or before the requested period
        (an enrollment stays in force month to month from its start period until it is rejected or cancelled).
        Because every in-force enrollment also takes a spot in all later months, `availableSpots` is `maxCapacity` minus all in-force
        enrollments of the group (never negative): the spots that can still be reserved from that period on.
        This is the only endpoint guardians use to browse groups.
      x-endpoint-id: E5
      x-roles: [ADMIN, GUARDIAN]
      x-error-codes: [VALIDATION_ERROR, PERIOD_IN_PAST]
      parameters:
        - { $ref: '#/components/parameters/PeriodRequired' }
        - name: disciplineId
          in: query
          schema: { type: integer, format: int32 }
      responses:
        '200':
          description: Availability per group.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/GroupAvailability' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /enrollments:
    post:
      tags: [Enrollments]
      operationId: createEnrollment
      summary: Request an enrollment
      description: |
        **Roles:** GUARDIAN (own athlete), ADMIN. Creates the enrollment in `PENDING_REVIEW` with `paymentStatus` `OVERDUE`
        and reserves a spot, checked under a pessimistic lock on the group row. `period` is the start month: the enrollment stays
        in force month to month until it is rejected or cancelled. Returns 409 `DUPLICATE_ENROLLMENT` when the athlete already has an
        in-force enrollment (`PENDING_REVIEW` or `ACTIVE`) in the same discipline, whatever its group or start period; to move to
        another group use E15. Enrollments in other disciplines are allowed.
        When there is no spot, nothing is created, the e-mail `NO_SPOTS_AVAILABLE` is sent and the call returns 409
        (the e-mail is sent once the mail adapter exists, phase 7). A spot is free when the group's in-force enrollments, whatever their
        start period, are fewer than `maxCapacity`. Checks run in this order: athlete and group exist (404), ownership (403), age,
        period, active group and discipline (422), duplicate and spots (409).
      x-endpoint-id: E6
      x-roles: [GUARDIAN, ADMIN]
      x-error-codes: [VALIDATION_ERROR, NOT_FOUND, AGE_OUT_OF_RANGE, PERIOD_IN_PAST, GROUP_INACTIVE, NO_AVAILABLE_SPOTS, DUPLICATE_ENROLLMENT]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateEnrollmentRequest' }
      responses:
        '201':
          description: Enrollment requested.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnrollmentDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    get:
      tags: [Enrollments]
      operationId: listEnrollments
      summary: List enrollments (paginated)
      description: |
        **Roles:** ADMIN (all), GUARDIAN (own, automatic). Admin filters `paymentReported=true` to see families that reported a payment.
        `period` returns the enrollments in force that month: start period on or before it and, unless `status` is given,
        `PENDING_REVIEW` or `ACTIVE`. Sorted newest first.
      x-endpoint-id: E7
      x-roles: [ADMIN, GUARDIAN]
      x-error-codes: []
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/EnrollmentStatus' }
        - name: paymentStatus
          in: query
          schema: { $ref: '#/components/schemas/PaymentStatus' }
        - name: paymentReported
          in: query
          schema: { type: boolean }
        - { $ref: '#/components/parameters/Period' }
        - name: disciplineId
          in: query
          schema: { type: integer, format: int32 }
        - name: groupId
          in: query
          schema: { type: integer, format: int32 }
        - name: athleteId
          in: query
          schema: { type: integer, format: int32 }
        - name: guardianId
          in: query
          description: Admin only.
          schema: { type: integer, format: int32 }
      responses:
        '200':
          description: A page of enrollments.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnrollmentPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /enrollments/{id}:
    parameters:
      - { $ref: '#/components/parameters/IdPath' }
    get:
      tags: [Enrollments]
      operationId: getEnrollment
      summary: Get an enrollment with schedules
      description: '**Roles:** ADMIN, GUARDIAN (own).'
      x-endpoint-id: E8
      x-roles: [ADMIN, GUARDIAN]
      x-error-codes: [NOT_FOUND]
      responses:
        '200':
          description: Enrollment detail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnrollmentDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /enrollments/{id}/confirm:
    parameters:
      - { $ref: '#/components/parameters/IdPath' }
    post:
      tags: [Enrollments]
      operationId: confirmEnrollment
      summary: Confirm an enrollment
      description: |
        **Roles:** ADMIN. Moves to `ACTIVE`, sets `confirmedAt`, and sends `ENROLLMENT_CONFIRMED` after commit (not awaited, RNF-04).
        `groupId` (optional) assigns another group of the same discipline; `payment` (optional, same body as E17) registers the payment
        in the same call, under the same rules as E17, and sets `paymentStatus` to `UP_TO_DATE`; without it the enrollment stays `OVERDUE`.
        If the payment breaks a rule nothing is confirmed. The e-mail is sent once the mail adapter exists (phase 7). Only from `PENDING_REVIEW` (409 `INVALID_STATE`). Without `groupId`, or with the current one,
        the current group must still be active (422 `GROUP_INACTIVE`); another group must be of the same discipline, active and with a
        free spot.
      x-endpoint-id: E12
      x-roles: [ADMIN]
