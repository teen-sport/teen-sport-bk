# Versiones de las dependencias que no gestiona el BOM de Spring Boot.
# Las dependencias de Spring Boot se declaran sin versión en build.gradle.kts.
[versions]
springdoc = "3.1.1"

[libraries]
springdoc-openapi-starter-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }
